<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 学生成绩管理系统</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" method="post" action="/login">
    <h1>学生成绩管理系统</h1>
    <p class="auth-sub">请登录后使用（演示账号 admin / admin123）</p>
    {% if error %}
    <div class="auth-msg error"><span>✕</span><span>{{ error }}</span></div>
    {% endif %}
    {% if registered %}
    <div class="auth-msg info"><span>✓</span><span>注册成功，请登录</span></div>
    {% endif %}
    <div class="form-field">
      <label for="username">用户名</label>
      <input id="username" name="username" required autofocus>
    </div>
    <div class="form-field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" required>
    </div>
    <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
    <button type="submit" class="btn btn-primary">登 录</button>
    <p class="auth-switch">没有账号？<a href="/register">注册</a></p>
  </form>
</div>
</body>
</html>
