<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">学生成绩管理系统</a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">仪表盘</a>
      <a href="/students" class="{{ 'active' if request.url.path.startswith('/students') }}">学生管理</a>
      <a href="/teachers" class="{{ 'active' if request.url.path.startswith('/teachers') }}">教师管理</a>
      <a href="/courses" class="{{ 'active' if request.url.path.startswith('/courses') }}">课程管理</a>
      <a href="/grades" class="{{ 'active' if request.url.path.startswith('/grades') }}">成绩管理</a>
      <a href="/stats" class="{{ 'active' if request.url.path.startswith('/stats') }}">统计报表</a>
    </nav>
    <div class="user-box">
      <span class="user-name">{{ user.nickname or user.username }}</span>
      <form method="post" action="/logout">
        <button type="submit" class="btn btn-ghost btn-sm">退出</button>
      </form>
    </div>
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<div id="toast-root"></div>
<script src="/static/js/common.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
