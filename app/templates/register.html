<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 - 学生成绩管理系统</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" method="post" action="/register">
    <h1>注册账号</h1>
    <p class="auth-sub">密码使用 PBKDF2-SHA256（60 万次迭代）加盐哈希存储</p>
    {% if error %}
    <div class="auth-msg error"><span>✕</span><span>{{ error }}</span></div>
    {% endif %}
    <div class="form-field">
      <label for="username">用户名（至少 3 个字符）</label>
      <input id="username" name="username" required minlength="3" maxlength="32" autofocus>
    </div>
    <div class="form-field">
      <label for="nickname">昵称（可选）</label>
      <input id="nickname" name="nickname" maxlength="32">
    </div>
    <div class="form-field">
      <label for="password">密码（至少 6 位）</label>
      <input id="password" name="password" type="password" required minlength="6" maxlength="64">
    </div>
    <div class="form-field">
      <label for="confirm">确认密码</label>
      <input id="confirm" name="confirm" type="password" required>
    </div>
    <button type="submit" class="btn btn-primary">注 册</button>
    <p class="auth-switch">已有账号？<a href="/login">返回登录</a></p>
  </form>
</div>
</body>
</html>
